   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b3a" x="586.8" y="94.758281" transform="rotate(-0 586.8 94.758281)">TWO HULLS</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(586.8 117.190406)">XPS core with fiberglass covering.</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(586.8 130.549777)">Shape here is schematic; use photos</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(586.8 143.909147)">for the physical outline.</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b3a" x="586.8" y="202.758281" transform="rotate(-0 586.8 202.758281)">CENTRAL COMPARTMENT</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(586.8 225.190406)">Electronics bay, separate waterproof</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(586.8 238.549777)">box and centrally placed battery</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(586.8 251.909147)">were described in the build notes.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b3a" x="586.8" y="310.758281" transform="rotate(-0 586.8 310.758281)">FOUR ROTATING UNITS</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(586.8 333.190406)">Four 680 RPM DC motor / propeller</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(586.8 346.549777)">units on MG996R servo mounts.</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(586.8 359.909147)">Teal symbols mark approximate locations.</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b3a" x="586.8" y="418.758281" transform="rotate(-0 586.8 418.758281)">TWO REAR BOOSTERS</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(586.8 441.190406)">Raised rear propellers were added</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(586.8 454.549777)">for stronger forward pushing.</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #182b3a" x="586.8" y="526.758281" transform="rotate(-0 586.8 526.758281)">READ WITH THE RECEIVER CODE</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(586.8 549.190406)">CH2 supplies one shared vector command.</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(586.8 562.549777)">Match motor indices and polarity</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(586.8 575.909147)">to the installed mounts.</text>
   </g>
   <g id="text_20">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52616b" x="32.4" y="623.52" transform="rotate(-0 32.4 623.52)">LAYOUT SKETCH • Approximate reported envelope: 23 × 17 × 13 in • Mounting positions are schematic.</text>
   </g>
  </g>
