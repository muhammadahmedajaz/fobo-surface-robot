   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(104.29875 161.834328)">2 joysticks</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(106.813594 174.93175)">3 buttons</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(85.215156 188.029172)">ESP32 transmitter</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #22577a" x="318.168" y="135.624256" transform="rotate(-0 318.168 135.624256)">Radio frame</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(294.507844 161.663547)">ESP-NOW</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(268.447688 174.760969)">8 channels + CRC-8</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(252.363313 187.921828)">21 bytes | nominal 100 Hz</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #22577a" x="517.374" y="135.624256" transform="rotate(-0 517.374 135.624256)">ESP32 receiver</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(473.306813 161.834328)">Size + CRC check</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(453.070094 174.93175)">Motor mixing / servo map</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #182b3a" transform="translate(473.197438 188.029172)">Link timeout gate</text>
   </g>
   <g id="text_8">
